<style>
  /* ===============================
   PAGE BACKGROUND
   =============================== */

body{
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
        135deg,
        #080808 0%,
        #0f2027 45%,
        #203a43 100%
    );
    color: #fff;
    position: relative;
    overflow-x: hidden;
}

/* ===============================
   PINK + CYAN GLOW EFFECT
   =============================== */

body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;

    background:
        radial-gradient(
            circle at 15% 25%,
            rgba(255, 0, 100, 0.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(0, 200, 255, 0.10),
            transparent 40%
        );
}

/* ===============================
   OPTIONAL GLASS EFFECT SECTIONS
   =============================== */

.section,
.container-box,
.card{
    background: rgba(20,20,20,0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 15px;
}
</style>
